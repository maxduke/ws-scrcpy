name: Format Appium source

on:
  push:
    branches:
      - agent/docker-auth-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/docker-auth-hardening

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2
          cache: npm

      - name: Format and commit Appium source
        run: |
          npm ci --omit=optional --ignore-scripts --no-audit --no-fund
          npx prettier --write src/server/appl-device/services/AppiumRunner.ts
          if git diff --quiet -- src/server/appl-device/services/AppiumRunner.ts; then
            echo "Source is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/appl-device/services/AppiumRunner.ts
          git commit -m "Format Appium runner"
          git push
