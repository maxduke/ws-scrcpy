name: Publish Docker image
run-name: Publish ${{ inputs.image_tag }} from ${{ inputs.branch }}

'on':
  workflow_dispatch:
    inputs:
      image_tag:
        description: Version tag
        required: true
        default: latest
        type: string
      branch:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string

env:
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/ws-scrcpy
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ws-scrcpy

concurrency:
  group: docker-publish-${{ inputs.branch }}-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != 'latest' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ws-scrcpy
          cache-to: type=gha,mode=max,scope=ws-scrcpy
