name: Publish Docker image
run-name: Publish ${{ inputs.image_tag }} from ${{ inputs.branch }}

'on':
  workflow_dispatch:
    inputs:
      image_tag:
        description: Version tag
        required: true
        default: latest
        type: string
      branch:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      update_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean
      publish_dockerhub:
        description: Also publish to Docker Hub
        required: true
        default: true
        type: boolean

env:
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/ws-scrcpy
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ws-scrcpy

concurrency:
  group: docker-publish-${{ inputs.branch }}-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: ${{ inputs.publish_dockerhub }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ inputs.publish_dockerhub }}
            name=${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.update_latest && inputs.image_tag != 'latest' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ws-scrcpy
          cache-to: type=gha,mode=max,scope=ws-scrcpy
          provenance: mode=max
          sbom: true
